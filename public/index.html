<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OPS - Personal OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(255,255,255,0.15);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div style="display:flex; justify-content:center; margin-bottom:12px;">
      <img src="/ops.png" alt="OPS Logo" width="48" height="48" style="border-radius: 12px;" />
    </div>
    <div class="spinner"></div>
    <h2 style="font-size: 18px; font-weight: 800;">OPS Operating System</h2>
    <p style="color: #94a3b8; font-size: 13px; margin-top: 6px;">Opening ops.mohitrajsinh.me...</p>
  </div>

  <script>
    window.location.replace('https://ops.mohitrajsinh.me');
  </script>
</body>
</html>
